services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: outreachos
      POSTGRES_USER: outreachos
      POSTGRES_PASSWORD: outreachos-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreachos -d outreachos"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://outreachos:outreachos-local-only@db:5432/outreachos}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-fake-gemini-key}
      FERNET_KEY: ${FERNET_KEY:-}
      SEND_MODE: ${SEND_MODE:-dry-run}
      ALLOWLIST: ${ALLOWLIST:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_STARTER_PRICE_USD: ${STRIPE_STARTER_PRICE_USD:-0}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/integrations/google/callback}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "week4.worker", "--org-id", "${WORKER_ORG_ID:-1}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://outreachos:outreachos-local-only@db:5432/outreachos}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-fake-gemini-key}
      FERNET_KEY: ${FERNET_KEY:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/integrations/google/callback}
      SEND_MODE: ${SEND_MODE:-dry-run}
      ALLOWLIST: ${ALLOWLIST:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres_data:
